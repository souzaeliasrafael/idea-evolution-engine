services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./.env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:////data/iee.db
      LOG_LEVEL: INFO
      FRONTEND_ORIGIN: http://localhost:3000
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - iee_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  iee_data:
